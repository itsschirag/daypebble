name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly: re-verify the next 120 days of puzzles
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
